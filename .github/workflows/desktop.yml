name: desktop

on:
  push:
    branches: [main]
  pull_request:

jobs:
  electron-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - run: bun install --frozen-lockfile
      - run: bun run build:desktop
      - run: xvfb-run -a bun run test:desktop
      - run: bun run package:desktop
      - run: xvfb-run -a node scripts/e2e/desktop.e2e.mjs apps/desktop/dist/linux-unpacked/allstudio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence
          path: apps/desktop/dist/evidence
